<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Электронная библиотека</title>
  <meta name="description" content="Электронная библиотека с поиском и сортировкой книг">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="./">📚 <span>Электронная библиотека</span></a>
      <div class="authbox">
        <span class="authbox__email muted" id="authEmail" hidden></span>
        <a class="btn" id="loginLink" href="login.html">Войти</a>
        <button class="btn btn--ghost" id="logoutBtn" type="button" hidden>Выйти</button>
        <button class="btn btn--ghost" id="themeToggle" type="button" aria-label="Сменить тему">🌓</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Найдите свою следующую книгу</h1>
      <p>Поиск по названию, автору и описанию. Категории, новинки, популярное, фильтры по жанру и языку.</p>
      <form class="search" id="searchForm" role="search">
        <input id="search" type="search" placeholder="Например: Толстой, Python, космос…" autocomplete="off" aria-label="Поиск книг">
      </form>
    </section>

    <section class="shelf" id="newShelf" aria-labelledby="newTitle" hidden>
      <h2 id="newTitle">Новинки</h2>
      <div class="shelf__row" id="newList"></div>
    </section>

    <nav class="chips" id="categories" aria-label="Категории" hidden></nav>

    <section class="toolbar" aria-label="Фильтры и сортировка">
      <label>Жанр
        <select id="genre"><option value="">Все жанры</option></select>
      </label>
      <label>Язык
        <select id="language"><option value="">Все языки</option></select>
      </label>
      <label>Сортировать
        <select id="sort">
          <option value="title">По названию</option>
          <option value="author">По автору</option>
          <option value="year">По году</option>
          <option value="rating">По рейтингу</option>
          <option value="pages">По объёму</option>
          <option value="new">Сначала новые</option>
          <option value="views">Популярные</option>
        </select>
      </label>
      <button class="btn" id="order" type="button" title="Направление сортировки">↑ А→Я</button>
      <button class="btn btn--ghost" id="reset" type="button">Сбросить</button>
    </section>

    <p class="status" id="status" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
    <nav class="pager" id="pager" aria-label="Страницы"></nav>
  </main>

  <footer class="footer container">Электронная библиотека · учебный проект · HTML + CSS + JS · FastAPI · Supabase</footer>

  <dialog id="modal" class="modal">
    <button class="modal__close btn btn--ghost" id="modalClose" type="button" aria-label="Закрыть">✕</button>
    <div id="modalBody"></div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
