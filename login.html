<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Электронная библиотека</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="./">📚 <span>Электронная библиотека</span></a>
    </div>
  </header>

  <main class="container">
    <section class="authcard">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabLogin" role="tab" type="button" aria-selected="true">Вход</button>
        <button class="tab" id="tabSignup" role="tab" type="button" aria-selected="false">Регистрация</button>
      </div>

      <p class="muted" id="reason"></p>

      <form id="authForm" novalidate>
        <label>Почта
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.kg">
        </label>
        <label>Пароль
          <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="не меньше 6 символов">
        </label>
        <button class="btn btn--active btn--wide" id="submit" type="submit">Войти</button>
        <p class="formmsg" id="msg" role="alert" aria-live="polite"></p>
      </form>

      <p class="muted"><button class="linkbtn" id="forgot" type="button">Забыли пароль?</button></p>
      <p class="muted small">Чтобы читать книги, нужен аккаунт. Это бесплатно.</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
